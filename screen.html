<!DOCTYPE html>
<!-- Fv_Cinema - © Five Dev - جميع الحقوق محفوظة -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Cinema Screen</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #video-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #idle, #err {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; pointer-events: none;
        }
        #idle { color: rgba(255,255,255,0.35); font-size: 6vw; background: #000; }
        #err  { color: #ff6b6b; font-size: 3vw; padding: 4vw; box-sizing: border-box; background: rgba(0,0,0,0.85); }
        .hidden { display: none !important; }
        /* covers YouTube ads. pointer-events: none so the "Skip" clicks still reach YouTube's button */
        #adcover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vw;
            background: radial-gradient(circle at 50% 40%, #1c1c22 0%, #000 75%);
            color: #fff; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; text-align: center;
            pointer-events: none; z-index: 10;
        }
        #adcover .t1 { font-size: 5vw; font-weight: 700; }
        #adcover .t2 { font-size: 2.4vw; color: rgba(255,255,255,0.55); }
        #adcover .dots span { display: inline-block; width: 1.4vw; height: 1.4vw; margin: 0 0.6vw; border-radius: 50%;
            background: #c00; animation: blink 1.2s infinite; }
        #adcover .dots span:nth-child(2) { animation-delay: 0.2s; }
        #adcover .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="video-frame"></div>
    <!-- v7: catches the script's "Skip" click when NO ad is showing, so it can never pause the video.
         Hidden during an ad, so the click reaches YouTube's Skip button. -->
    <div id="shield" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;background:transparent;"></div>
    <div id="adcover" class="hidden">
        <div class="t1">العرض يبدأ خلال لحظات</div>
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="t2">Five Dev Cinema</div>
    </div>
    <div id="idle">CINEMA</div>
    <div id="err" class="hidden"></div>
    <div id="dbg" class="hidden" style="position:absolute;left:1%;top:1%;z-index:20;padding:0.6vw 1vw;background:rgba(0,0,0,0.8);
        color:#0f0;font:bold 1.6vw Consolas,monospace;white-space:pre;pointer-events:none;"></div>
    <script>
// Runs inside a DUI (an invisible browser page drawn onto the in-world screen).
// Receives commands from client/main.lua through SendDuiMessage.

let player = null;
let playerReady = false;
let queue = [];
let volume = 100;
let pauseAfterLoad = false;
// what the remote wants (v2). If the video pauses on its own (e.g. the "Skip ad" clicks hit the
// video instead of the Skip button), it is resumed right away.
let wantPlaying = false;
let lastCommand = 0;

const idleEl = document.getElementById('idle');
const errEl = document.getElementById('err');

function showError(msg) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
function clearError() { errEl.classList.add('hidden'); }

// ---------- ad cover (v5) ----------
// An ad is detected when (any of):
//  - the player plays a different video id than the one we loaded
//  - the player's length differs from the real length of our video (sent by the server)
//  - the time stands still for 1 second while it should play (loading / some ads)
// -> the screen is covered and muted, so nobody sees or hears the ad.
const adCoverEl = document.getElementById('adcover');
const dbgEl = document.getElementById('dbg');
let adMode = false;
let lastTime = -1;
let stuckSince = 0;
let unstartedSince = 0;
let currentId = null;       // the video the remote loaded
let expectedDuration = 0;    // its real length in seconds (0 = not known yet)
let debugOn = false;
let adReason = '';

function setAdMode(on) {
    if (on === adMode) return;
    adMode = on;
    adCoverEl.classList.toggle('hidden', !on);
    document.getElementById('shield').classList.toggle('hidden', on);
    try { if (on) player.mute(); else player.unMute(); } catch (e) { /* player not ready */ }
}

setInterval(() => {
    if (!playerReady || !player || typeof player.getPlayerState !== 'function') return;
    if (!wantPlaying) { stuckSince = 0; unstartedSince = 0; lastTime = -1; setAdMode(false); return; }
    const state = player.getPlayerState();
    const t = player.getCurrentTime() || 0;
    const dur = (player.getDuration && player.getDuration()) || 0;
    let vid = '';
    try { const vd = player.getVideoData && player.getVideoData(); vid = (vd && vd.video_id) || ''; } catch (e) { /* ignore */ }

    let ad = false;
    adReason = '';
    // v6: tested in game - during a YouTube ad the player reports state -1 ("not started")
    // with our own id / length / a time that does not move. The real video is 1 (playing) or 3 (buffering).
    if (state === -1 || state === 5) {
        if (!unstartedSince) unstartedSince = Date.now();
    } else {
        unstartedSince = 0;
    }
    if (unstartedSince && Date.now() - unstartedSince > 700) {
        ad = true; adReason = 'not started (ad)';
    } else if (vid && currentId && vid !== currentId) {
        ad = true; adReason = 'other video id';
    } else if (expectedDuration > 0 && dur > 0 && Math.abs(dur - expectedDuration) > 2) {
        ad = true; adReason = 'other length';
    } else if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.ENDED) {
        stuckSince = 0; // stopped on purpose or finished
    } else if (lastTime < 0 || Math.abs(t - lastTime) < 0.05) {
        if (!stuckSince) stuckSince = Date.now();
        if (Date.now() - stuckSince > 1000) { ad = true; adReason = 'time stands still'; }
    } else {
        stuckSince = 0;
    }
    setAdMode(ad);
    lastTime = t;

    if (debugOn) {
        dbgEl.textContent =
            'state ' + state + '   ad ' + (adMode ? 'YES (' + adReason + ')' : 'no') + '\n' +
            'id    ' + (vid || '-') + '  (want ' + (currentId || '-') + ')\n' +
            'time  ' + t.toFixed(1) + ' / ' + dur.toFixed(1) + '  (real length ' + (expectedDuration || '?') + ')';
    }
}, 250);

// ---------- YouTube ----------
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
tag.onerror = () => showError('Could not load YouTube (check the game client internet access)');
document.head.appendChild(tag);

// YouTube now requires embedders to send a proper Referer header (Error 153 otherwise).
// The IFrame API builds its own <iframe> and doesn't let us set the attribute directly,
// so we catch it the instant it's inserted and patch it in before it starts loading.
new MutationObserver((mutations, obs) => {
    const frame = document.querySelector('#video-frame iframe, iframe#video-frame');
    if (frame && !frame.hasAttribute('referrerpolicy')) {
        frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    }
}).observe(document.documentElement, { childList: true, subtree: true });

function onYouTubeIframeAPIReady() {
    player = new YT.Player('video-frame', {
        host: 'https://www.youtube-nocookie.com',
        width: '100%',
        height: '100%',
        playerVars: {
            origin: window.location.origin,
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            modestbranding: 1,
            playsinline: 1,
            rel: 0
        },
        events: {
            onReady: () => {
                playerReady = true;
                player.setVolume(volume);
                const q = queue; queue = [];
                q.forEach(handle);
            },
            onStateChange: (e) => {
                if (e.data === YT.PlayerState.PLAYING && pauseAfterLoad) {
                    pauseAfterLoad = false;
                    player.pauseVideo();
                    return;
                }
                // paused without an order from the remote -> play again
                if (e.data === YT.PlayerState.PAUSED && wantPlaying && Date.now() - lastCommand > 500) {
                    setTimeout(() => { if (wantPlaying) player.playVideo(); }, 150);
                }
            },
            onError: (e) => {
                const messages = {
                    2: 'Invalid YouTube link',
                    5: 'Player error',
                    100: 'Video not found or private',
                    101: 'Embedding disabled by the video owner',
                    150: 'Embedding disabled by the video owner',
                    153: 'YouTube rejected the embed (Error 153)'
                };
                showError((messages[e.data] || 'Playback error') + ' [' + e.data + ']');
            }
        }
    });
}

function extractYouTubeId(url) {
    const idRe = /^[A-Za-z0-9_-]{11}$/;
    try {
        const u = new URL(String(url).trim());
        const host = u.hostname.replace(/^(www\.|m\.|music\.)/, '');
        let id = null;
        if (host === 'youtu.be') {
            id = u.pathname.slice(1).split('/')[0];
        } else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
            if (u.pathname === '/watch') {
                id = u.searchParams.get('v');
            } else {
                const m = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([^/?]+)/);
                if (m) id = m[1];
            }
        }
        if (id && idRe.test(id)) return id;
    } catch (e) { /* not a URL */ }
    return null;
}

// ---------- commands ----------
function handle(msg) {
    lastCommand = Date.now();
    switch (msg.action) {
        case 'load': {
            const id = extractYouTubeId(msg.url || '');
            if (!id) { showError('Invalid YouTube link'); return; }
            clearError();
            idleEl.classList.add('hidden');
            pauseAfterLoad = (msg.playing === false);
            wantPlaying = !pauseAfterLoad;
            if (id !== currentId) expectedDuration = 0;
            currentId = id;
            if (msg.duration > 0) expectedDuration = msg.duration;
            player.loadVideoById({ videoId: id, startSeconds: Math.max(0, msg.timestamp || 0) });
            player.setVolume(volume);
            break;
        }
        case 'clear':
            pauseAfterLoad = false;
            wantPlaying = false;
            currentId = null;
            expectedDuration = 0;
            player.stopVideo();
            idleEl.classList.remove('hidden');
            break;
        case 'play':
            wantPlaying = true;
            player.seekTo(msg.timestamp || 0, true);
            player.playVideo();
            break;
        case 'resume': // play again without jumping (sent after the "Skip ad" clicks)
            if (wantPlaying) player.playVideo();
            break;
        case 'sync': { // sent by the server every few seconds: keep every player on the exact same second
            if (msg.duration > 0) expectedDuration = msg.duration;
            if (typeof player.getCurrentTime !== 'function') break;
            if (adMode) break; // an ad is on: correct the time once the ad is over
            const target = Math.max(0, msg.timestamp || 0);
            const dur = player.getDuration ? player.getDuration() : 0;
            if (dur > 0 && target >= dur - 1) break; // the video already ended
            const state = player.getPlayerState();
            const drift = Math.abs(player.getCurrentTime() - target);
            wantPlaying = !!msg.playing;
            if (drift > (msg.tolerance || 1.5)) player.seekTo(target, true);
            if (msg.playing) {
                if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) player.playVideo();
            } else if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            }
            break;
        }
        case 'pause':
            wantPlaying = false;
            player.pauseVideo();
            if (typeof msg.timestamp === 'number') player.seekTo(msg.timestamp, true);
            break;
        case 'seek':
            player.seekTo(msg.timestamp || 0, true);
            break;
        case 'volume':
            volume = Math.max(0, Math.min(100, msg.volume || 0));
            player.setVolume(volume);
            break;
        case 'debug': // /cinemadebug: shows what YouTube reports, on the screen itself
            debugOn = !!msg.on;
            dbgEl.classList.toggle('hidden', !debugOn);
            break;
    }
}

window.addEventListener('message', (event) => {
    let data = event.data;
    if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (e) { return; }
    }
    if (!data || !data.action) return;

    if (data.action === 'volume') volume = Math.max(0, Math.min(100, data.volume || 0));

    if (!playerReady) { queue.push(data); return; }
    handle(data);
});

</script>
</body>
</html>
